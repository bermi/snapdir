schema_version: 1

# Gatesmith quality-gate ledger for porting snapdir (Bash) -> snapdir-rs (Rust).
# Single source of truth. The PM picks the next pending|failed gate whose deps are
# all passed (priority: phase asc, failure_count desc, id asc), spawns its
# owner_agent from .gatesmith/templates/<owner_agent>.md, re-runs verification_cmd,
# enforces the lane fence, applies pass_criteria, and commits on pass.
#
# Behavioral source of truth = the Bash oracle in the repo root (./snapdir,
# ./snapdir-manifest, snapdir-*-store). Those scripts + utils/qa-fixtures/ are the
# FROZEN ORACLE and must never be edited by any lane.
#
# pass_criteria DSL: exit_code | file_exists | files_exist | regex_match |
#   json_path(+op+value) | human_confirm | and:[...]

gates:
  # ===================================================================
  # Phase 0 — Bootstrap
  # ===================================================================
  - id: bootstrap-ready
    phase: 0
    owner_agent: generic
    depends_on: []
    status: passed
    passed_at: 2026-05-31T01:16:12Z
    git_sha: 904b48a
    failure_count: 0
    verification_cmd: "test -f docs/rust-port/PLAN.md && test -f .gatesmith/templates/ci.md && test -f .gatesmith/templates/core.md"
    pass_criteria:
      and:
        - exit_code: 0
        - files_exist: [docs/rust-port/PLAN.md, .gatesmith/templates/ci.md, .gatesmith/templates/core.md]
    human_checkpoint: false
    description: "Bootstrap complete: plan vendored, ledger + lane templates authored."

  # ===================================================================
  # Phase 1 — Scaffolding + CI foundation  (lanes: ci, cli)
  # ===================================================================
  - id: scaffold-workspace
    phase: 1
    owner_agent: ci
    depends_on: [bootstrap-ready]
    status: passed
    passed_at: 2026-05-31T01:18:04Z
    git_sha: 3799bb1
    failure_count: 0
    verification_cmd: "cargo build --workspace --locked"
    pass_criteria:
      and:
        - exit_code: 0
        - files_exist: [Cargo.toml, rust-toolchain.toml, crates/snapdir-core/Cargo.toml, crates/snapdir-cli/Cargo.toml, crates/snapdir-stores/Cargo.toml, crates/snapdir-catalog/Cargo.toml]
    human_checkpoint: false
    description: "Cargo workspace (core/cli/stores/catalog) builds clean with a pinned toolchain."

  - id: fmt-clean
    phase: 1
    owner_agent: ci
    depends_on: [scaffold-workspace]
    status: passed
    passed_at: 2026-05-31T01:35:00Z
    git_sha: 426fb45
    failure_count: 0
    verification_cmd: "cargo fmt --all --check"
    pass_criteria:
      exit_code: 0
    human_checkpoint: false
    description: "rustfmt is clean across the workspace."

  - id: clippy-pedantic-clean
    phase: 1
    owner_agent: ci
    depends_on: [scaffold-workspace]
    status: passed
    passed_at: 2026-05-31T01:27:47Z
    git_sha: 03ac5ff
    failure_count: 0
    verification_cmd: "cargo clippy --workspace --all-targets --all-features --locked -- -D warnings"
    pass_criteria:
      exit_code: 0
    human_checkpoint: false
    description: "clippy::pedantic (workspace lints) passes with -D warnings."

  - id: cli-skeleton
    phase: 1
    owner_agent: cli
    depends_on: [scaffold-workspace]
    status: passed
    passed_at: 2026-05-31T01:30:35Z
    git_sha: dd1de1f
    failure_count: 0
    verification_cmd: "cargo run -q -p snapdir-cli -- help 2>&1 | grep -Eo 'manifest|id|stage|push|fetch|pull|checkout|verify|verify-cache|flush-cache|locations|ancestors|revisions|defaults' | sort -u | tr '\\n' ' '"
    pass_criteria:
      and:
        - exit_code: 0
        - regex_match: "ancestors.*checkout.*defaults.*fetch.*flush-cache.*id.*locations.*manifest.*pull.*push.*revisions.*stage.*verify.*verify-cache"
    human_checkpoint: false
    description: "clap binary exposes all 14 subcommands (stubbed) + global options."

  - id: ci-config
    phase: 1
    owner_agent: ci
    depends_on: [scaffold-workspace]
    status: passed
    passed_at: 2026-05-31T01:23:22Z
    git_sha: e3411a8
    failure_count: 0
    verification_cmd: "test -f .github/workflows/ci.yaml && test -f deny.toml && test -f _typos.toml && (command -v actionlint >/dev/null 2>&1 && actionlint .github/workflows/ci.yaml || echo 'actionlint not installed - file-existence only')"
    pass_criteria:
      and:
        - exit_code: 0
        - files_exist: [.github/workflows/ci.yaml, deny.toml, _typos.toml]
    human_checkpoint: false
    description: "ci.yaml (lint/deny/test-matrix incl. musl/coverage/semver) exists and lints clean."

  - id: ci-matrix-green
    phase: 1
    owner_agent: ci
    depends_on: [ci-config, fmt-clean, clippy-pedantic-clean, cli-skeleton]
    status: passed
    passed_at: 2026-05-31T01:36:48Z
    git_sha: 1a90657
    failure_count: 0
    verification_cmd: "echo 'Confirm the GitHub Actions ci.yaml run (incl. the x86_64-unknown-linux-musl static leg) is green for branch rust-port.'"
    pass_criteria:
      human_confirm: "Is the ci.yaml matrix (Linux/macOS/Windows + musl static) green on GitHub for rust-port?"
    human_checkpoint: true
    description: "Full CI matrix incl. musl static build is green on GitHub (operator confirms)."

  # ===================================================================
  # Phase 2 — Core manifest/hashing engine + FREEZE  (lane: core)
  # ===================================================================
  - id: manifest-format
    phase: 2
    owner_agent: core
    depends_on: [scaffold-workspace]
    status: passed
    passed_at: 2026-05-31T01:46:33Z
    git_sha: 88b3a85
    failure_count: 0
    verification_cmd: "cargo test -p snapdir-core --locked manifest"
    pass_criteria:
      exit_code: 0
    human_checkpoint: false
    description: "Manifest Display reproduces 'TYPE PERM CHECKSUM SIZE PATH', sort -k5, comment/empty handling, ./ vs --absolute."

  - id: dir-merkle
    phase: 2
    owner_agent: core
    depends_on: [manifest-format]
    status: passed
    passed_at: 2026-05-31T01:51:01Z
    git_sha: 960f20e
    failure_count: 0
    verification_cmd: "cargo test -p snapdir-core --locked checksum"
    pass_criteria:
      exit_code: 0
    human_checkpoint: false
    # DESC-CORRECTION 2026-05-31 (human-approved): the original "snapshot id = root
    # checksum" was a doc bug. Per oracle (snapdir L259/762), snapshot id = b3sum of
    # the #-stripped manifest text; the directory checksum is the D-line CHECKSUM field.
    description: "Directory checksum = sort+dedup+concat(no separators)+rehash of children's checksums; this is the D-line CHECKSUM field (NOT the snapshot id — see snapshot-id-core-fix)."

  - id: golden-b3
    phase: 2
    owner_agent: core
    depends_on: [dir-merkle]
    status: passed
    passed_at: 2026-05-31T01:55:16Z
    git_sha: 4069b43
    failure_count: 0
    verification_cmd: "cargo test -p snapdir-core --locked golden_b3sum"
    pass_criteria:
      exit_code: 0
    human_checkpoint: false
    description: "BLAKE3 golden manifests match utils/qa-fixtures hashes byte-for-byte (dba5865c…, af1349b9…, 4a0732cf…)."

  # -------------------------------------------------------------------
  # Remediation gates (human-approved 2026-05-31T01:55:16Z): correct the
  # snapshot-ID contract discrepancy surfaced by golden-b3 BEFORE freeze.
  # Oracle truth (snapdir L259/762/436/776): snapshot id = `manifest |
  # grep -v '^#' | b3sum --no-names` (b3sum of full #-stripped manifest text,
  # incl. trailing newline) — NOT the root directory checksum.
  # -------------------------------------------------------------------
  - id: snapshot-id-core-fix
    phase: 2
    owner_agent: core
    depends_on: [golden-b3]
    status: passed
    passed_at: 2026-05-31T02:06:14Z
    git_sha: 02405d2
    failure_count: 0
    verification_cmd: "cargo test -p snapdir-core --locked snapshot_id"
    pass_criteria:
      exit_code: 0
    human_checkpoint: false
    description: "Add snapshot_id(manifest)=b3sum(#-stripped manifest text incl trailing newline); relabel merkle.rs docs + replace the misleading snapshot_id_equals_root_directory_checksum test. Reproduces golden ids c678a299…/8af03a1b…."

  - id: snapshot-id-doc-fix
    phase: 2
    owner_agent: docs
    depends_on: [golden-b3]
    status: passed
    passed_at: 2026-05-31T02:19:35Z
    git_sha: dede4ea
    failure_count: 0
    verification_cmd: "grep -q 'b3sum' docs/rust-port/PLAN.md && ! grep -Eq 'Root dir checksum = snapshot ID' docs/rust-port/PLAN.md"
    pass_criteria:
      exit_code: 0
    human_checkpoint: false
    description: "Correct PLAN.md frozen-contract: snapshot ID = b3sum of #-stripped manifest text (not the root dir checksum); keep the dir-checksum rule for the D-line CHECKSUM field."

  - id: golden-multi
    phase: 2
    owner_agent: core
    depends_on: [golden-b3, snapshot-id-core-fix]
    failure_count: 0
    # GATE-BUMP 2026-05-31T02:10:12Z: the original verification_cmd quoted all five
    # filters as ONE positional ("golden_md5 golden_sha256 ...") — cargo/libtest treats
    # that as a single space-containing filter that matches ZERO tests yet exits 0 (a
    # hollow pass proving nothing). Fixed to pass them as separate libtest filters after
    # `--` (OR-matched), so the gate actually exercises md5/sha256/keyed/exclude/no_follow.
    # pass_criteria unchanged (exit_code 0). Not a pass-criterion/threshold/value/schema
    # mutation; mechanical correction realizing the gate's documented intent.
    bump_reason: "quoted-single-filter ran 0 tests (hollow pass); split into separate libtest filters after -- to actually run the intended tests"
    verification_cmd: "cargo test -p snapdir-core --locked -- golden_md5 golden_sha256 keyed_context exclude no_follow"
    status: passed
    passed_at: 2026-05-31T02:10:12Z
    git_sha: 3481e94
    pass_criteria:
      exit_code: 0
    human_checkpoint: false
    description: "--checksum-bin md5sum/sha256sum, SNAPDIR_MANIFEST_CONTEXT keyed mode, %system%/%common% excludes, --no-follow all match."

  - id: freeze-contract
    phase: 2
    owner_agent: core
    depends_on: [golden-b3, golden-multi, snapshot-id-core-fix, snapshot-id-doc-fix]
    status: passed
    passed_at: 2026-05-31T02:22:13Z
    git_sha: e3b1e69
    # FROZEN @ 2026-05-31T02:22:13Z (human-approved). SHA locks:
    #   .gatesmith/golden-fixtures.sha.lock   (utils/qa-fixtures/expected-guide-commands.txt)
    #   .gatesmith/manifest-format.sha.lock   (core manifest.rs/merkle.rs/excludes.rs)
    # PM re-verifies both each tick; mismatch = critical alert -> AskUserQuestion.
    frozen: true
    failure_count: 0
    verification_cmd: "cargo test -p snapdir-core --locked"
    pass_criteria:
      and:
        - exit_code: 0
        - human_confirm: "Core manifest output matches the golden fixtures exactly. FREEZE the manifest format spec + golden fixtures now?"
    human_checkpoint: true
    description: "FREEZE: manifest format + golden fixtures locked; downstream lanes build against a stable oracle."

  # ===================================================================
  # Phase 3 — 1:1 interoperability gate (HARD)  (lane: tests)
  # ===================================================================
  - id: interop-harness
    phase: 3
    owner_agent: tests
    depends_on: [freeze-contract]
    status: passed
    passed_at: 2026-05-31T10:34:09Z
    git_sha: 4a6984e
    failure_count: 0
    verification_cmd: "bash tests/interop/run.sh --self-check"
    pass_criteria:
      and:
        - exit_code: 0
        - file_exists: tests/interop/run.sh
    human_checkpoint: false
    description: "Differential harness exists: generates the fixture corpus and can diff Bash oracle vs Rust binary."

  # -------------------------------------------------------------------
  # Prerequisite gates (PM-sequenced 2026-05-31T10:34:09Z): the interop-harness
  # teammate confirmed the KEYSTONE interop-diff cannot pass while the Rust
  # `snapdir manifest` is a stub. These implement the plan-implied work: a real
  # filesystem walk in core + wiring the CLI manifest command to it. Plan-implied
  # implementation steps; not a contract/pass_criteria change. (GATE-ADD journaled.)
  # -------------------------------------------------------------------
  - id: core-walk
    phase: 3
    owner_agent: core
    depends_on: [freeze-contract]
    status: passed
    passed_at: 2026-05-31T10:58:43Z
    git_sha: ddc35d4
    failure_count: 0
    verification_cmd: "cargo test -p snapdir-core --locked walk"
    pass_criteria:
      exit_code: 0
    human_checkpoint: false
    description: "Filesystem walk in snapdir-core: directory tree -> Manifest matching the frozen format (perms via stat, content sizes, dir size = sum of members, symlink-follow default / --no-follow drops, %system%/%common% excludes wired), feeding directory_checksum + snapshot_id. Library-pure (path in, no terminal I/O)."

  - id: cli-manifest-wire
    phase: 3
    owner_agent: cli
    depends_on: [core-walk, cli-skeleton]
    status: passed
    passed_at: 2026-05-31T11:08:59Z
    git_sha: f24da42
    failure_count: 0
    verification_cmd: "cargo test -p snapdir-cli --locked manifest"
    pass_criteria:
      exit_code: 0
    human_checkpoint: false
    description: "Wire `snapdir manifest [--absolute --exclude --no-follow --checksum-bin] <path>` + `snapdir id` to the core walk/manifest/snapshot_id (no longer a stub); emit oracle-identical stdout. CLI integration test over a known tiny tree."

  - id: interop-diff
    phase: 3
    owner_agent: tests
    depends_on: [interop-harness, core-walk, cli-manifest-wire]
    status: passed
    passed_at: 2026-05-31T11:26:21Z
    git_sha: 5421977
    failure_count: 0
    verification_cmd: "bash tests/interop/run.sh"
    pass_criteria:
      and:
        - exit_code: 0
        - human_confirm: "Zero manifest/ID diffs between Bash and Rust across the full corpus (b3/md5/sha256 + keyed). Sign off the interop gate?"
    human_checkpoint: true
    description: "KEYSTONE HARD GATE: byte-identical manifests + IDs, Bash vs Rust, across the corpus and all checksum modes."

  # ===================================================================
  # Phase 4 — Store abstraction + FileStore  (lanes: core, stores, tests)
  # ===================================================================
  - id: store-trait
    phase: 4
    owner_agent: core
    depends_on: [freeze-contract]
    status: passed
    passed_at: 2026-05-31T11:58:52Z
    git_sha: ee6bbf8
    failure_count: 0
    verification_cmd: "cargo test -p snapdir-core --locked store"
    pass_criteria:
      exit_code: 0
    human_checkpoint: false
    description: "Store trait (get_manifest/fetch_files/push) + sharded-path helpers defined in snapdir-core."

  - id: file-store
    phase: 4
    owner_agent: stores
    depends_on: [store-trait]
    status: passed
    passed_at: 2026-05-31T12:04:31Z
    git_sha: 12991f8
    failure_count: 0
    verification_cmd: "cargo test -p snapdir-stores --locked file_store"
    pass_criteria:
      exit_code: 0
    human_checkpoint: false
    description: "FileStore: .objects/.manifests sharded layout, push (objects-before-manifest, skip-if-present), fetch (verify/retry/atomic-rename)."

  - id: external-store-shim
    phase: 4
    owner_agent: stores
    depends_on: [file-store]
    status: passed
    passed_at: 2026-05-31T12:09:32Z
    git_sha: cadf93a
    failure_count: 0
    verification_cmd: "cargo test -p snapdir-stores --locked shim"
    pass_criteria:
      exit_code: 0
    human_checkpoint: false
    description: "External-store emit-command shim for third-party snapdir-*-store binaries; gs://->gcs special-case router replicated."

  # Prerequisite (PM-sequenced 2026-05-31T12:09:32Z): file-store-roundtrip runs the
  # Rust CLI push->fetch->checkout, but those subcommands are still stubs (only
  # manifest/id are wired). This gate wires them to snapdir-stores FileStore + core.
  # Plan-implied implementation step; not a contract/pass_criteria change. (GATE-ADD journaled.)
  - id: cli-store-wire
    phase: 4
    owner_agent: cli
    depends_on: [file-store, cli-manifest-wire]
    status: passed
    passed_at: 2026-05-31T12:20:52Z
    git_sha: 4fa69f2
    failure_count: 0
    verification_cmd: "cargo test -p snapdir-cli --locked store_roundtrip"
    pass_criteria:
      exit_code: 0
    human_checkpoint: false
    description: "Wire `snapdir push/fetch/pull/checkout/verify` to snapdir-stores (FileStore via file://) + core: stage objects, push (objects-before-manifest), fetch+verify, checkout reproduces the source tree. CLI integration test `store_roundtrip` over a temp file:// store."

  - id: file-store-roundtrip
    phase: 4
    owner_agent: tests
    depends_on: [file-store, cli-skeleton, cli-store-wire, interop-diff]
    status: passed
    passed_at: 2026-05-31T12:27:26Z
    git_sha: 78c4598
    failure_count: 0
    verification_cmd: "bash tests/integration/file_store_roundtrip.sh"
    pass_criteria:
      and:
        - exit_code: 0
        - file_exists: tests/integration/file_store_roundtrip.sh
    human_checkpoint: false
    description: "End-to-end push -> fetch -> checkout reproduces the source tree and verifies via the Rust CLI + file://."

  # ===================================================================
  # Phase 5 — Remote stores via native SDKs  (lanes: stores, tests)
  # ===================================================================
  - id: s3-store
    phase: 5
    owner_agent: stores
    depends_on: [external-store-shim]
    status: passed
    passed_at: 2026-05-31T12:34:41Z
    git_sha: 35974b6
    failure_count: 0
    verification_cmd: "cargo test -p snapdir-stores --locked s3_store && cargo build -p snapdir-stores --locked"
    pass_criteria:
      exit_code: 0
    human_checkpoint: false
    description: "S3Store via aws-sdk-s3 (ring rustls); standard AWS credential chain; preserves keys/ordering/verify."

  - id: b2-store
    phase: 5
    owner_agent: stores
    depends_on: [s3-store]
    status: passed
    passed_at: 2026-05-31T12:45:17Z
    git_sha: 99ad154
    failure_count: 0
    verification_cmd: "cargo test -p snapdir-stores --locked b2_store"
    pass_criteria:
      exit_code: 0
    human_checkpoint: false
    description: "B2Store via aws-sdk-s3 against Backblaze's S3-compatible endpoint (custom endpoint URL)."

  - id: gcs-store
    phase: 5
    owner_agent: stores
    depends_on: [s3-store]
    status: passed
    passed_at: 2026-05-31T12:50:10Z
    git_sha: 14d1690
    failure_count: 0
    verification_cmd: "cargo test -p snapdir-stores --locked gcs_store"
    pass_criteria:
      exit_code: 0
    human_checkpoint: false
    description: "GcsStore via google-cloud-storage (ring); parse gs://bucket/prefix exactly; ordering + verify/retry/atomic-rename."

  # Prerequisite (PM-sequenced 2026-05-31T12:50:10Z): remote-interop is a human
  # checkpoint requiring emulator round-trips + Bash<->Rust cross-tool. Like
  # interop-harness→interop-diff, the operator needs a harness to run. This gate
  # builds it (with an emulator-free --self-check). Plan-implied; GATE-ADD journaled.
  - id: remote-stores-harness
    phase: 5
    owner_agent: tests
    depends_on: [s3-store, b2-store, gcs-store, file-store-roundtrip]
    status: passed
    passed_at: 2026-05-31T13:02:44Z
    git_sha: 7e70953
    failure_count: 0
    verification_cmd: "bash tests/integration/remote_stores.sh --self-check"
    pass_criteria:
      and:
        - exit_code: 0
        - file_exists: tests/integration/remote_stores.sh
    human_checkpoint: false
    description: "Differential remote-store harness: round-trip S3/B2/GCS against emulators (MinIO / B2 sandbox / fake-gcs-server) + Bash<->Rust cross-tool fetch; --self-check validates plumbing without live emulators (real round-trips are the remote-interop human checkpoint)."

  # Prerequisite (PM-sequenced 2026-05-31T13:02:44Z): the remote-stores-harness
  # teammate found the CLI `resolve_store` (cli.rs) only wires file://; s3/b2/gs bail.
  # The remote Store impls exist in snapdir-stores but aren't reachable from
  # push/fetch — so the operator's live remote-interop Rust lanes would fail until
  # this wiring lands. Plan-implied impl step; GATE-ADD journaled.
  - id: cli-remote-store-wire
    phase: 5
    owner_agent: cli
    depends_on: [cli-store-wire, s3-store, b2-store, gcs-store]
    status: passed
    passed_at: 2026-05-31T13:09:48Z
    git_sha: 700dd84
    failure_count: 0
    verification_cmd: "cargo test -p snapdir-cli --locked remote_store_routing"
    pass_criteria:
      exit_code: 0
    human_checkpoint: false
    description: "Wire CLI resolve_store to route s3://->S3Store, b2://->B2Store, gs://->GcsStore (+ external shim for other schemes) so push/fetch/checkout/pull/verify work against remote stores. Unit test the routing (no live creds)."

  - id: remote-interop
    phase: 5
    owner_agent: tests
    depends_on: [s3-store, b2-store, gcs-store, file-store-roundtrip, remote-stores-harness, cli-remote-store-wire]
    # GATE-BUMP 2026-06-01T01:52:18Z (operator-approved: AskUserQuestion "Yes — PM auto-verifies").
    # The original gate was a HOLLOW human-checkpoint: verification_cmd was a bare `echo` and
    # pass_criteria a lone human_confirm — it verified NOTHING and nearly produced a false pass
    # this session. Replaced with a real PM-run differential harness (MinIO S3 Bash<->Rust
    # cross-tool + a zero-external-dependency lane that runs the Rust round-trip with aws/b2/gcloud
    # removed from PATH). Hermetic (docker-only), runs every tick. GCS/B2 split into their own
    # gates: gcs-store-notfound-fix / remote-interop-gcs / remote-interop-b2.
    bump_reason: "hollow human_confirm over an echo verified nothing (near false-pass); replaced with PM-run live harness asserting exit_code 0 + S3 cross-tool ran + zero-external-dependency lane passed"
    status: passed
    passed_at: 2026-06-01T01:52:18Z
    git_sha: fd17c22
    failure_count: 0
    verification_cmd: "bash tests/integration/remote_stores_live.sh"
    pass_criteria:
      and:
        - exit_code: 0
        - regex_match: "remote-interop LIVE: backends ran \\[[^]]*s3[^]]*\\] \\+ zero-external-dependency lane passed"
    human_checkpoint: false
    description: "PM-auto-verified: S3 (MinIO) Bash<->Rust cross-tool byte-identical + zero-external-dependency (Rust round-trip with aws/b2/gcloud absent from PATH). Hermetic, docker-only, runs every tick."

  - id: gcs-store-notfound-fix
    phase: 5
    owner_agent: stores
    depends_on: [gcs-store]
    # GATE-ADD 2026-06-01T01:52:18Z: the new live harness caught a real GcsStore bug — key_exists/
    # get_bytes only treated HTTP 404 as absent, but google-cloud-storage v1.12 reports a missing
    # object as service-level Code::NotFound (http_status_code()==None), so skip-if-present aborted
    # EVERY real GCS push before upload. The env-gated unit test never ran without creds. Fixed via
    # an is_not_found() helper (HTTP 404 OR service NotFound), mirroring S3's is_not_found().
    status: passed
    passed_at: 2026-06-01T01:52:18Z
    git_sha: f08cb84
    failure_count: 0
    verification_cmd: "SNAPDIR_GCS_TEST_STORE=gs://snapdir-integration-testing/rust-port-fixcheck-$$ cargo test -p snapdir-stores --locked gcs_store_live_round_trip_when_configured -- --nocapture"
    pass_criteria:
      and:
        - exit_code: 0
        - regex_match: "gcs_store_live_round_trip_when_configured \\.\\.\\. ok"
    human_checkpoint: false
    description: "GcsStore classifies google-cloud-storage service-level Code::NotFound (http_status_code()==None) as absent in key_exists/get_bytes, not just HTTP 404; live round-trip against real GCS (push/get_manifest/fetch) passes and MUST run (not skip)."

  - id: remote-interop-gcs
    phase: 5
