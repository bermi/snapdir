  # Fast walk + hashing (operator-requested 2026-06-12, MUST ship in 1.7.0).
  # `snapdir id`/manifest/stage/push walk is single-threaded recursion that
  # slurps each file whole via std::fs::read (walk.rs:390) then one-shot hashes
  # it (Hasher::hash_hex) — no read concurrency, no streaming, big per-file Vec.
  # Three wins, all left on the table: (1) BLAKE3 is internally tree-parallel
  # (update_mmap_rayon) so one large file hashes across cores; (2) mmap removes
  # the whole-file heap copy; (3) cross-file parallelism saturates NVMe + cores.
  # KEYSTONE CONSTRAINT: snapshot ids must be BYTE-IDENTICAL before/after every
  # gate. Determinism is structural — directory_checksum sorts+dedups child
  # checksums via BTreeSet (merkle.rs:198), member-size is a sum, and
  # manifest.sort() sorts by path (walk.rs:294) — so the ORDER checksums are
  # produced never affects output; the Meter is already atomic/Sync (progress.rs).
  # Plan: .claude/plans/what-s-our-std-fs-read-concurrency-greedy-stearns.md.
  # Adversary owns tests (black-box, spec-driven); lanes write source only.
