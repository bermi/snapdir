  # PHASE 13 — Concurrent transfers & bandwidth control (operator-requested 2026-06-04)
  # Audit: all stores transfer objects SEQUENTIALLY (await loop in one block_on); no
  # concurrency/rate-limit primitives; no --jobs/--limit-rate. Store trait is sync +
  # per-manifest and NOT frozen -> concurrency goes INSIDE block_on (buffer_unordered),
  # sharding layout + manifest format untouched. Decisions: concurrency AUTO on by
  # default (available_parallelism capped at 16; --jobs overrides); --limit-rate is
  # AGGREGATE (one shared token bucket); zero-dep limiter; FileStore parallelized too.
  # Must preserve: manifest-last, skip-if-present, per-object verify (Phase 12).
