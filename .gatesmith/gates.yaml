  # re-downloads EVERY object from the store on a 2nd pull of the same id, even when the
  # cache already holds them (run_fetch always materializes into a fresh scratch and never
  # consults the cache). That is the operator's actual complaint ("pull is very slow on
  # second runs, downloading all the objects again" — message that opened Phase 12). The
  # correctness suite below depends on this fix so its idempotent-pull scenario can pass.
