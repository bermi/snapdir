        - regex_match: "test result: ok"
    human_checkpoint: false
    description: "run_fetch (cli) must not re-download objects already present in the local cache. When the cache already holds the snapshot's manifest (its objects are present by the manifest-written-last invariant), skip the store fetch ENTIRELY; otherwise fetch only the objects missing from the cache. Fixes the operator-reported regression where a 2nd `snapdir pull`/`fetch` of the same id re-downloads every object from the store (network) despite a populated cache. Test (cli lane, file:// store): after a first pull, DELETE the store objects (keep the manifest) with the cache populated, then pull/fetch again -> must succeed with ZERO store object reads. Name the test fn with `fetch_cached`."

