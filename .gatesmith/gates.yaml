  # PHASE 12 — Post-1.0 correctness & UX (operator-reported 2026-06-04)
  # ----------------------------------------------------------------------
  # Four issues surfaced while exercising the released 1.0.1 binary. Two are
  # confirmed bugs (one a SEVERE regression from pre-1.0 Bash), one is a CLI
  # ergonomics gap, and the manifest "buffering" item is a documented WON'T-FIX:
  # the manifest is globally path-sorted (sort -k5) and dir checksums are
  # computed bottom-up over each whole subtree, so no line is valid until the
  # full walk completes — incremental streaming would break the frozen format.
  # No crates.io release for 1.0.1 (GitHub-only, by choice).
  # ======================================================================

